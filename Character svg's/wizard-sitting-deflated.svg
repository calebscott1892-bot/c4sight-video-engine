<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="-32 -45 64 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Sitting body -->
  <path d="M -18 18 L -22 50 L 22 50 L 18 18 Z" fill="#B49FCC" />
  <!-- Crossed legs hint -->
  <rect x="-10" y="42" width="20" height="6" rx="2" fill="#B49FCC" />
  <!-- Slumped arms -->
  <rect x="-22" y="20" width="5" height="20" rx="2.5" fill="#B49FCC" transform="rotate(-20 -19 30)" />
  <rect x="17" y="20" width="5" height="20" rx="2.5" fill="#B49FCC" transform="rotate(20 19 30)" />
  <!-- Head sunk low -->
  <circle cx="0" cy="6" r="10" fill="#B49FCC" />
  <!-- Hat flopped forward -->
  <g transform="rotate(40 0 6)">
    <path d="M -14 -2 L 0 -28 L 14 -2 Z" fill="#2A2530" />
    <circle cx="-5" cy="-10" r="1.2" fill="#FFFFFF" />
    <circle cx="5" cy="-10" r="1.2" fill="#FFFFFF" />
  </g>
  <!-- Wand lying on ground -->
  <g transform="translate(-22 49) rotate(-8)">
    <rect x="-7" y="-0.6" width="14" height="1.2" fill="#1A1520" />
    <rect x="-9" y="-1" width="2" height="2" fill="#FFFFFF" />
  </g>
</svg>
