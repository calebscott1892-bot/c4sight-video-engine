<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="-32 -45 64 100" xmlns="http://www.w3.org/2000/svg">
  <g transform="rotate(-12 0 25)">
    <!-- Skewed robe -->
    <path d="M -10 0 L -16 50 L 14 50 L 10 0 Z" fill="#B49FCC" />
    <!-- Crossed arms -->
    <rect x="-10" y="6" width="18" height="4" rx="2" fill="#B49FCC" transform="rotate(10 -1 8)" />
    <rect x="-8" y="12" width="18" height="4" rx="2" fill="#B49FCC" transform="rotate(-10 1 14)" />
    <!-- Head -->
    <circle cx="-1" cy="-8" r="11" fill="#B49FCC" />
    <!-- Eyes averted -->
    <circle cx="-5" cy="-8" r="2.4" fill="#FFFFFF" />
    <circle cx="3" cy="-8" r="2.4" fill="#FFFFFF" />
    <circle cx="-6.4" cy="-8" r="1.2" fill="#1A1520" />
    <circle cx="1.6" cy="-8" r="1.2" fill="#1A1520" />
    <!-- Pressed-flat mouth -->
    <path d="M -3 -3 L 3 -3" stroke="#1A1520" stroke-width="1" stroke-linecap="round" />
    <!-- Hat -->
    <g transform="translate(-1 0)">
      <path d="M -14 -19 L 0 -42 L 14 -19 Z" fill="#2A2530" />
      <path d="M 0 -31 L 0.8 -28.8 L 3 -28 L 0.8 -27.2 L 0 -25 L -0.8 -27.2 L -3 -28 L -0.8 -28.8 Z" fill="#FFFFFF" />
      <circle cx="-6" cy="-24" r="1.2" fill="#FFFFFF" />
      <circle cx="6" cy="-24" r="1.2" fill="#FFFFFF" />
    </g>
  </g>
</svg>
