<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="-32 -45 64 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Body -->
  <path d="M -12 0 L -18 50 L 18 50 L 12 0 Z" fill="#B49FCC" />
  <!-- Right arm extended fully horizontal to the LEFT -->
  <rect x="-30" y="-2" width="18" height="5" rx="2.5" fill="#B49FCC" />
  <!-- Finger tip -->
  <rect x="-32" y="-1" width="3" height="3" rx="1" fill="#B49FCC" />
  <!-- Opposite arm at side -->
  <rect x="14" y="2" width="5" height="26" rx="2.5" fill="#B49FCC" />
  <!-- Head -->
  <circle cx="0" cy="-8" r="11" fill="#B49FCC" />
  <!-- Eyes look left -->
  <circle cx="-4" cy="-8" r="2.6" fill="#FFFFFF" />
  <circle cx="4" cy="-8" r="2.6" fill="#FFFFFF" />
  <circle cx="-5.5" cy="-8" r="1.3" fill="#1A1520" />
  <circle cx="2.5" cy="-8" r="1.3" fill="#1A1520" />
  <!-- Mouth -->
  <path d="M -3 -3 L 3 -3" stroke="#1A1520" stroke-width="1" stroke-linecap="round" />
  <!-- Hat -->
  <path d="M -14 -19 L 0 -42 L 14 -19 Z" fill="#2A2530" />
  <path d="M 0 -31 L 0.8 -28.8 L 3 -28 L 0.8 -27.2 L 0 -25 L -0.8 -27.2 L -3 -28 L -0.8 -28.8 Z" fill="#FFFFFF" />
  <circle cx="-6" cy="-24" r="1.2" fill="#FFFFFF" />
  <circle cx="6" cy="-24" r="1.2" fill="#FFFFFF" />
</svg>
