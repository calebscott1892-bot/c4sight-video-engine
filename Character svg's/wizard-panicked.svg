<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="-32 -45 64 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Body -->
  <path d="M -12 0 L -18 50 L 18 50 L 12 0 Z" fill="#B49FCC" />
  <!-- Arms slightly raised -->
  <rect x="-22" y="-4" width="5" height="26" rx="2.5" fill="#B49FCC" transform="rotate(-15 -19 6)" />
  <rect x="17" y="-4" width="5" height="26" rx="2.5" fill="#B49FCC" transform="rotate(15 19 6)" />
  <!-- Head -->
  <circle cx="0" cy="-8" r="11" fill="#B49FCC" />
  <!-- Very wide eye whites -->
  <circle cx="-4" cy="-8" r="3.4" fill="#FFFFFF" />
  <circle cx="4" cy="-8" r="3.4" fill="#FFFFFF" />
  <!-- Small centred pupils -->
  <circle cx="-4" cy="-8" r="1" fill="#1A1520" />
  <circle cx="4" cy="-8" r="1" fill="#1A1520" />
  <!-- Raised brow lines -->
  <path d="M -7 -13 L -1 -13.5" stroke="#1A1520" stroke-width="1" stroke-linecap="round" />
  <path d="M 1 -13.5 L 7 -13" stroke="#1A1520" stroke-width="1" stroke-linecap="round" />
  <!-- O mouth -->
  <ellipse cx="0" cy="-2" rx="1.4" ry="1.8" fill="#1A1520" />
  <!-- Hat -->
  <path d="M -14 -19 L 0 -42 L 14 -19 Z" fill="#2A2530" />
  <path d="M 0 -31 L 0.8 -28.8 L 3 -28 L 0.8 -27.2 L 0 -25 L -0.8 -27.2 L -3 -28 L -0.8 -28.8 Z" fill="#FFFFFF" />
  <circle cx="-6" cy="-24" r="1.2" fill="#FFFFFF" />
  <circle cx="6" cy="-24" r="1.2" fill="#FFFFFF" />
  <!-- Wand -->
  <g transform="translate(20 20) rotate(20)">
    <rect x="-0.6" y="-12" width="1.2" height="14" fill="#1A1520" />
    <rect x="-1" y="-13.5" width="2" height="2" fill="#FFFFFF" />
  </g>
</svg>
