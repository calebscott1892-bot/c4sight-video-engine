<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="-32 -45 64 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Narrower, lower robe -->
  <path d="M -8 6 L -13 50 L 13 50 L 8 6 Z" fill="#B49FCC" />
  <!-- Arms -->
  <rect x="-12" y="8" width="4" height="20" rx="2" fill="#B49FCC" />
  <rect x="8" y="8" width="4" height="20" rx="2" fill="#B49FCC" />
  <!-- Head -->
  <circle cx="0" cy="-1" r="10" fill="#B49FCC" />
  <!-- Eyes fully closed -->
  <path d="M -7 -2 Q -4 -0.5 -1 -2" stroke="#1A1520" stroke-width="1.3" fill="none" stroke-linecap="round" />
  <path d="M 1 -2 Q 4 -0.5 7 -2" stroke="#1A1520" stroke-width="1.3" fill="none" stroke-linecap="round" />
  <!-- Flat mouth -->
  <path d="M -2.5 4 L 2.5 4" stroke="#1A1520" stroke-width="0.9" stroke-linecap="round" />
  <!-- Hat tilted 15° -->
  <g transform="rotate(15 0 -10)">
    <path d="M -14 -10 L 0 -34 L 14 -10 Z" fill="#2A2530" />
    <path d="M 0 -23 L 0.8 -20.8 L 3 -20 L 0.8 -19.2 L 0 -17 L -0.8 -19.2 L -3 -20 L -0.8 -20.8 Z" fill="#FFFFFF" />
    <circle cx="-6" cy="-16" r="1.2" fill="#FFFFFF" />
    <circle cx="6" cy="-16" r="1.2" fill="#FFFFFF" />
  </g>
  <!-- Wand dropped -->
  <g transform="translate(16 48) rotate(80)">
    <rect x="-0.6" y="-7" width="1.2" height="14" fill="#1A1520" />
    <rect x="-1" y="-8.5" width="2" height="2" fill="#FFFFFF" />
  </g>
</svg>
