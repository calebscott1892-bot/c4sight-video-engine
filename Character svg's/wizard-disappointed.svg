<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="-32 -45 64 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Body -->
  <path d="M -12 0 L -18 50 L 18 50 L 12 0 Z" fill="#B49FCC" />
  <!-- Arms -->
  <rect x="-19" y="2" width="5" height="26" rx="2.5" fill="#B49FCC" />
  <rect x="14" y="2" width="5" height="26" rx="2.5" fill="#B49FCC" />
  <!-- Head tilted down -->
  <circle cx="0" cy="-6" r="11" fill="#B49FCC" />
  <!-- Hat brim shoved low -->
  <path d="M -16 -10 L 0 -38 L 16 -10 Z" fill="#2A2530" />
  <path d="M 0 -26 L 0.8 -23.8 L 3 -23 L 0.8 -22.2 L 0 -20 L -0.8 -22.2 L -3 -23 L -0.8 -23.8 Z" fill="#FFFFFF" />
  <!-- Wide brim shadow -->
  <rect x="-12" y="-10" width="24" height="3" fill="#2A2530" />
  <!-- Eyes barely visible -->
  <circle cx="-3.5" cy="-6" r="0.9" fill="#1A1520" />
  <circle cx="3.5" cy="-6" r="0.9" fill="#1A1520" />
  <!-- Flat resigned mouth -->
  <path d="M -3 -1 L 3 -1" stroke="#1A1520" stroke-width="1" stroke-linecap="round" />
  <!-- Wand -->
  <g transform="translate(18 26)">
    <rect x="-0.6" y="-12" width="1.2" height="14" fill="#1A1520" />
    <rect x="-1" y="-13.5" width="2" height="2" fill="#FFFFFF" />
  </g>
</svg>
